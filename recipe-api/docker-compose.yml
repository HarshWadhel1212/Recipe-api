# Starts a PostgreSQL database for the project.
# Run:  docker compose up -d
services:
  db:
    image: postgres:16
    container_name: recipe_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recipe_db
    ports:
      - "5432:5432"
    volumes:
      - recipe_data:/var/lib/postgresql/data

volumes:
  recipe_data:
